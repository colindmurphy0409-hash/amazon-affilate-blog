# Top brands to study — agents adapt their marketing patterns to Wellthlab
#
# HOW TO USE
# 1. Add brands you admire below (DTC supplements, wellness, oral formats, etc.)
# 2. Say: "Run competitor research" or "Research competitor brands"
# 3. Agents write playbooks to content/research/competitors/{slug}.md
# 4. Weekly content pulls adapted hooks from those playbooks + trend-brief.md
#
# RULES FOR AGENTS
# - Borrow FORMATS (hooks, pacing, carousel structure, video beats) — not verbatim copy
# - Never claim Wellthlab is those brands; never fake their social proof
# - Transform everything through brand/voice.md + brand/assets.md (exact product images only)
# - Structure/function claims only for supplement angles

